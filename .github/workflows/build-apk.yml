name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CanLua_Unlimited_ready_to_build_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tạo thư mục android
        run: flutter create --platforms=android --project-name canlua_unlimited --org com.canlua .
      - name: Nâng compileSdk lên 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CanLua-APK
          path: CanLua_Unlimited_ready_to_build_1/build/app/outputs/flutter-apk/app-release.apk
