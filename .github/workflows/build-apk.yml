name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CanLua_Unlimited_ready_to_build_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Bỏ thư viện không dùng
        run: sed -i '/share_plus:/d;/permission_handler:/d;/excel:/d;/path_provider:/d' pubspec.yaml
      - name: Tạo thư mục android
        run: flutter create --platforms=android --project-name canlua_unlimited --org com.canlua .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CanLua-APK
          path: CanLua_Unlimited_ready_to_build_1/build/app/outputs/flutter-apk/app-release.apk
